{% extends "events/base.html" %}

{% block content %}
<h1>Game Night Arranger</h1>
<p class="lead">Create a game night, share the link, and see which games people want to play.</p>

<form method="post" class="card stack">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <label>
      <span>{{ field.label }}</span>
      {{ field }}
      {% for error in field.errors %}<span class="error">{{ error }}</span>{% endfor %}
    </label>
  {% endfor %}
  <button type="submit" class="primary">Create event</button>
</form>
{% endblock %}
